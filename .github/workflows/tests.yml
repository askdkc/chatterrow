name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      IMAGEMAGICK_PATH: magick
      RUN_REDIS_INTEGRATION_TESTS: '1'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: redis
          tools: composer:v2
          coverage: none

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@7bcb45380be40873a59cc0d4a457ec9228b6c84c # v8.0.0

      - name: Verify ImageMagick
        run: |
          version="$(magick -version)"
          printf '%s\n' "$version"
          if [[ ! "$version" =~ ImageMagick[[:space:]]([0-9]+)([.[:space:]]|$) ]]; then
            echo 'Could not determine the ImageMagick major version.' >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          if (( major < 7 )); then
            echo "Expected ImageMagick major version 7 or newer; got $major." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Create MarkItDown fixtures
        run: .markitdown/venv/bin/python scripts/create-markitdown-fixtures.py

      - name: Verify MarkItDown environment
        run: |
          .markitdown/venv/bin/python -m pip check
          .markitdown/venv/bin/markitdown --version

      - name: Run CI Checks
        run: composer ci:check

  pgroonga:
    name: PostgreSQL + PGroonga integration
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: chatterrow
      DB_USERNAME: chatterrow
      DB_PASSWORD: chatterrow-password

    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-16@sha256:24bc15d68143620bf21eb292d905aa5e9bcff120fd09032f119ab316b38cd19a
        env:
          POSTGRES_DB: chatterrow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatterrow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pgsql
          tools: composer:v2
          coverage: none

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare database role and extension
        env:
          PGPASSWORD: postgres-password
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE chatterrow LOGIN PASSWORD 'chatterrow-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE chatterrow OWNER TO chatterrow;
          SQL
          psql --host=127.0.0.1 --username=postgres --dbname=chatterrow --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgroonga;
          SQL

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: Run PGroonga integration tests
        run: php artisan test --group=pgroonga --no-coverage
