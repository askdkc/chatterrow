version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Asia/Tokyo"

    cooldown:
      default-days: 5

    open-pull-requests-limit: 10

    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
